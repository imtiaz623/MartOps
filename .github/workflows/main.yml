name: Build APK

on:
  workflow_dispatch:        # Actions tab > Build APK > Run workflow
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo has no android/ folder, so generate it, then add our permissions and service.
      - name: Create Android project
        run: |
          flutter create --org com.martops --project-name martops --platforms=android _tmp
          cp -r _tmp/android ./android
          rm -rf _tmp
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p).read()
          add = open("AndroidManifest_additions.xml").read()
          perms = "\n".join(l for l in add.splitlines() if l.startswith("<uses-permission"))
          svc = '<service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="location" android:exported="false"/>'
          m = m.replace("<application", perms + "\n    <application", 1)
          m = m.replace("</application>", "    " + svc + "\n    </application>", 1)
          open(p, "w").write(m)
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle*

      # Optional: add repo secret API_URL (Settings > Secrets and variables > Actions) instead of editing api.dart.
      - name: Set API URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then sed -i "s|PASTE_APPS_SCRIPT_EXEC_URL|$API_URL|" lib/api.dart; fi
          grep -n "kApiUrl =" lib/api.dart

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: martops-apk
          path: build/app/outputs/flutter-apk/app-release.apk
