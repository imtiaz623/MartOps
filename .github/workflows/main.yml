name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: ls -la && ls -la lib

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          set -e
          flutter create --org com.martops --project-name martops --platforms=android _tmp
          rm -rf android
          cp -r _tmp/android ./android
          rm -rf _tmp
          ls android/app/src/main

      - name: Patch manifest and minSdk
        run: |
          set -e
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p).read()
          perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          svc = '    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService" android:foregroundServiceType="location" android:exported="false"/>\n'
          if "<application" not in m or "</application>" not in m:
              raise SystemExit("manifest format not as expected")
          m = m.replace("<application", perms + "    <application", 1)
          m = m.replace("</application>", svc + "    </application>", 1)
          open(p, "w").write(m)
          print(m)
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Set API URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then sed -i "s|PASTE_APPS_SCRIPT_EXEC_URL|$API_URL|" lib/api.dart; fi
          grep -n "kApiUrl =" lib/api.dart

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: martops-apk
          path: build/app/outputs/flutter-apk/app-release.apk
