name: martops
description: MartOps branch visit tracker (Owner, Manager)
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^8.17.0
  network_info_plus: ^6.0.0
  location: ^8.0.0
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  http: ^1.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#15131A"
  adaptive_icon_foreground: "icon_fg.png"
